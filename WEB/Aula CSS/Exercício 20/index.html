<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            background: blue;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: lightgray;
            padding: 15px;
            text-align: center;
        }

        section {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .coluna {
            flex: 1;
            background: lightblue;
            padding: 20px;
        }

        footer {
            background: black;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Meu site</h1>
    </header>

    <nav>
        Início | Sobre | Contato
    </nav>

    <section>
        <div class="coluna">
            <h2>Coluna 1</h2>
            <p>Texto da primeira coluna.</p>
        </div>

        <div class="coluna">
            <h2>Coluna 2</h2>
            <p>Texto da segunda coluna.</p>
        </div>
    </section>

    <footer>
        Rodapé
    </footer>

</body>

</html>

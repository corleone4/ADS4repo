<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 26</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .parallax {
            height: 500px;

            background-image: url("https://picsum.photos/1200/800");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-size: 40px;
        }

        .conteudo {
            height: 500px;
            padding: 50px;
            text-align: center;
        }
    </style>
</head>

<body>

    <section class="parallax">
        <h1>Efeito Parallax</h1>
    </section>

    <section class="conteudo">
        <h2>Conteúdo</h2>
        <p>
            Role a página para observar o efeito parallax.
        </p>
    </section>

</body>

</html>

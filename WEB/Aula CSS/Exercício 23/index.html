<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 23</title>

    <style>
        .caixa {
            width: 100px;
            height: 100px;
            background-color: blue;

            animation: mudar 2s infinite alternate;
        }

        @keyframes mudar {
            from {
                background-color: blue;
                width: 100px;
                height: 100px;
            }

            to {
                background-color: red;
                width: 200px;
                height: 200px;
            }
        }
    </style>
</head>

<body>

    <div class="caixa"></div>

</body>

</html>

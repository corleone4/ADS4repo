<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 24</title>

    <style>
        button {
            background-color: blue;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;

            transition: 0.5s;
        }

        button:hover {
            background-color: green;
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <button>Passe o mouse aqui</button>

</body>

</html>

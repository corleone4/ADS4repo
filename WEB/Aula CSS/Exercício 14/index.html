<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 14</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        header {
            display: block;
            width: 100%;
            background-color: #333;
            color: white;
            padding: 20px;
        }

        aside {
            display: block;
            width: 25%;
            float: left;
            background-color: #ddd;
            padding: 20px;
            min-height: 400px;
        }

        main {
            display: block;
            width: 75%;
            float: left;
            background-color: #f5f5f5;
            padding: 20px;
            min-height: 400px;
        }

        footer {
            display: block;
            width: 100%;
            clear: both;
            background-color: #333;
            color: white;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Cabeçalho</h1>
    </header>

    <aside>
        <h2>Menu</h2>
    </aside>

    <main>
        <h2>Conteúdo principal</h2>
        <p>
            Este é o conteúdo principal da página.
        </p>
    </main>

    <footer>
        <p>Rodapé</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 21</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: grid;
            grid-template-areas:
                "cabecalho cabecalho"
                "menu conteudo"
                "rodape rodape";

            grid-template-columns: 200px 1fr;
            grid-template-rows: 80px 1fr 60px;

            min-height: 100vh;
        }

        header {
            grid-area: cabecalho;
            background-color: #3498db;
            color: white;
            padding: 20px;
        }

        aside {
            grid-area: menu;
            background-color: #eeeeee;
            padding: 20px;
        }

        main {
            grid-area: conteudo;
            background-color: #ffffff;
            padding: 20px;
        }

        footer {
            grid-area: rodape;
            background-color: #333333;
            color: white;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <h1>Cabeçalho</h1>
    </header>

    <aside>
        <h2>Menu Lateral</h2>
        <ul>
            <li>Início</li>
            <li>Sobre</li>
            <li>Contato</li>
        </ul>
    </aside>

    <main>
        <h2>Conteúdo Principal</h2>
        <p>
            Este é o conteúdo principal da página.
        </p>
    </main>

    <footer>
        <p>Rodapé</p>
    </footer>

</body>

</html>

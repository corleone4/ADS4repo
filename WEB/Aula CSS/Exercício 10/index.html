<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercício 10</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      font-family: Arial;
    }

    header {
      background-color: royalblue;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .bloco {
      background-color: red;
      width: 50%;
      display: flex;
      gap: 15px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    figcaption {
      color: gray;
    }

    main {
      margin-top: 10%;
      border: 1px solid black;
    }

    .texto {
      display: flex;
      justify-content: center;
      margin: 2px;
      background-color: rgb(233, 233, 217);
      padding: 15px;
    }

    .hobbies {
      text-align: center;
      margin-top: 10px;
      background-color: rgb(212, 212, 211);
      padding: 15px;
    }

    footer {
      margin-top: 10%;
      background-color: black;
      color: white;
      padding: 15px;
    }
  </style>
</head>

<body>
  <header>
    <div class="bloco">
      <h1>Luan Henrique</h1>
      <img width="200" height="200" src="luan.jpeg" />
      <figcaption> todo esticado coitado</figcaption>
    </div>
  </header>

  <main>
    <div class="texto">
      <p> eu quero saber quem foi que me convenceu a cursar t.i, mas essa pessoa não estava na bondade comigo</p>
    </div>
    <div class="hobbies">
      <h3> eu gosto de:</h3>
      <ul>
        <li>musica</li>
        <li>jogar jogos</li>
        <li>igreja</li>
      </ul>
    </div>
  </main>
  <footer>
    espero que tenha gostado da minha apresentação individual do exercicio 10
  </footer>
</body>

</html>

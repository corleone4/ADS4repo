<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 17</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial;
    }

    .card {
      border-radius: 15px;
      background-color: grey;
      width: 35%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding-top: 3%;
      padding-left: 1%;
      padding-right: 1%;
      padding-bottom: 3%;
      box-shadow: 10px 5px 5px black;
      gap: 15px;
    }

    .card h3 {
      text-transform: uppercase;
    }

    .card button {
      background-color: white;
      font-size: 20px;
      border-radius: 15px;
    }

    .card button:hover {
      transform: scale(1.15);
    }
  </style>
</head>

<body>
  <div class="card">
    <h3> Produto 1 </h3>
    <img width="250" src="https://images.pexels.com/photos/5983407/pexels-photo-5983407.jpeg?auto=compress&cs=tinysrgb&h=750&w=1260">
    <p> Este produto é um produto muito bacana pois ele trás diversidade cultural para as pessoas que o consomem</p>
    <button> Comprar </button>
  </div>
</body>

</html>

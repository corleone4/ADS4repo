<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 13</title>
    <style>
        a:link {
            color: red;
            text-decoration: none;
            font-weight: bold;
            font-size:32px;
        }

 
        a:visited {
            color: gray;
            background-color: black;
            text-decoration: none;
            font-size:45px;
        }
  
        a:hover {
            color: red;
            text-decoration: underline;
            background-color: #f0f0f0;
            font-size:55px;
        }


        a:active {
            color: green;
            background-color: yellow;
            font-size:50px;
        }
    </style>
</head>
<body>
    <a href="####">Link1</a>
    <a href="#####">Link2</a>
    <a href="######">Link3</a>
</body>
</html>

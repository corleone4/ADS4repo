
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 4</title>
</head>
<body>
    <p id="texto">Este elemento será removido.</p>

    <button id="botao">Remover texto</button>

    <script>
        const botao = document.getElementById("botao");

        botao.addEventListener("click", function() {
            const texto = document.getElementById("texto");

            if (texto) {
                texto.remove();
            }
        });
    </script>
</body>
</html>

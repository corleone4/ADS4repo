<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 5</title>

    <style>
        .destaque {
            color: white;
            background-color: blue;
            padding: 10px;
        }
    </style>
</head>
<body>
    <p id="texto">Clique neste texto.</p>

    <script>
        const texto = document.getElementById("texto");

        texto.addEventListener("click", function() {
            texto.classList.toggle("destaque");
        });
    </script>
</body>
</html>

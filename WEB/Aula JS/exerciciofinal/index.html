<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Gerenciamento de Atividades</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="cabecalho">
    <div class="cabecalho__topo">
      <h1>Gerenciamento de Atividades</h1>
      <button type="button" id="btn-tema" class="btn btn--secundario">Modo escuro</button>
    </div>

    <section class="estatisticas" aria-label="Estatísticas">
      <div class="estatistica">
        <span class="estatistica__rotulo">Total</span>
        <strong id="stat-total">0</strong>
      </div>
      <div class="estatistica estatistica--pendente">
        <span class="estatistica__rotulo">Pendentes</span>
        <strong id="stat-pendentes">0</strong>
      </div>
      <div class="estatistica estatistica--andamento">
        <span class="estatistica__rotulo">Em andamento</span>
        <strong id="stat-andamento">0</strong>
      </div>
      <div class="estatistica estatistica--concluida">
        <span class="estatistica__rotulo">Concluídas</span>
        <strong id="stat-concluidas">0</strong>
      </div>
    </section>
  </header>

  <main class="conteudo">
    <div id="mensagem" class="mensagem" role="status" aria-live="polite" hidden></div>

    <section class="cartao" aria-labelledby="titulo-form">
      <h2 id="titulo-form">Nova atividade</h2>

      <form id="form-atividade" novalidate>
        <div class="grade">
          <div class="campo campo--largo">
            <label for="titulo">Título *</label>
            <input type="text" id="titulo" name="titulo" placeholder="Ex.: Estudar JavaScript" />
            <small class="erro" id="erro-titulo"></small>
          </div>

          <div class="campo campo--largo">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" rows="3" placeholder="Detalhes da atividade"></textarea>
          </div>

          <div class="campo">
            <label for="categoria">Categoria</label>
            <select id="categoria" name="categoria">
              <option value="estudo">Estudo</option>
              <option value="trabalho">Trabalho</option>
              <option value="pessoal">Pessoal</option>
            </select>
          </div>

          <div class="campo">
            <label for="prioridade">Prioridade</label>
            <select id="prioridade" name="prioridade">
              <option value="baixa">Baixa</option>
              <option value="media" selected>Média</option>
              <option value="alta">Alta</option>
            </select>
          </div>

          <div class="campo">
            <label for="data-limite">Data limite *</label>
            <input type="date" id="data-limite" name="dataLimite" />
            <small class="erro" id="erro-data"></small>
          </div>

          <div class="campo">
            <label for="situacao">Situação</label>
            <select id="situacao" name="situacao">
              <option value="pendente" selected>Pendente</option>
              <option value="andamento">Em andamento</option>
              <option value="concluida">Concluída</option>
            </select>
          </div>
        </div>

        <div class="acoes-form">
          <button type="submit" id="btn-salvar" class="btn">Adicionar atividade</button>
          <button type="button" id="btn-cancelar" class="btn btn--secundario" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>

    <section class="cartao" aria-labelledby="titulo-lista">
      <h2 id="titulo-lista">Minhas atividades</h2>

      <div class="controles">
        <div class="campo">
          <label for="busca">Pesquisar por título</label>
          <input type="search" id="busca" placeholder="Digite para pesquisar..." />
        </div>

        <div class="campo">
          <label for="filtro-situacao">Situação</label>
          <select id="filtro-situacao">
            <option value="todas">Todas</option>
            <option value="pendente">Pendente</option>
            <option value="andamento">Em andamento</option>
            <option value="concluida">Concluída</option>
          </select>
        </div>

        <div class="campo">
          <label for="filtro-prioridade">Prioridade</label>
          <select id="filtro-prioridade">
            <option value="todas">Todas</option>
            <option value="baixa">Baixa</option>
            <option value="media">Média</option>
            <option value="alta">Alta</option>
          </select>
        </div>

        <div class="campo">
          <label for="ordenacao">Ordenar por</label>
          <select id="ordenacao">
            <option value="titulo">Título</option>
            <option value="data">Data limite</option>
            <option value="prioridade">Prioridade</option>
          </select>
        </div>
      </div>

      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr>
              <th>Título</th>
              <th>Categoria</th>
              <th>Prioridade</th>
              <th>Data limite</th>
              <th>Situação</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista-atividades"></tbody>
        </table>
      </div>

      <p id="lista-vazia" class="lista-vazia" hidden>Nenhuma atividade encontrada.</p>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
